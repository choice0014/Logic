<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>logic</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="logo">∧</div>
        <div><strong>logic</strong></div>
      </div>
      <div>
        <button class="reset" id="theme">라이트 테마</button>
        <button class="reset" id="reset">회로 초기화</button>
      </div>
    </header>

    <main>
      <div class="layout">
        <aside class="panel">
          <h2>부품</h2>
          <button class="tool" data-add="input">
            <span class="icon">0 / 1</span>
            <span><b>입력</b><small>신호 스위치</small></span>
          </button>
          <button class="tool" data-add="AND">
            <span class="icon">&amp;</span>
            <span><b>AND</b><small>그리고</small></span>
          </button>
          <button class="tool" data-add="OR">
            <span class="icon">≥1</span>
            <span><b>OR</b><small>또는</small></span>
          </button>
          <button class="tool" data-add="NOT">
            <span class="icon">1</span>
            <span><b>NOT</b><small>반전</small></span>
          </button>
          <button class="tool" data-add="XOR">
            <span class="icon">=1</span>
            <span><b>XOR</b><small>배타적 OR</small></span>
          </button>
          <button class="tool" data-add="lamp">
            <span class="icon">●</span>
            <span><b>램프</b><small>출력 표시</small></span>
          </button>
          <button class="tool" data-add="memo">
            <span class="icon">✎</span>
            <span><b>메모</b><small>주석</small></span>
          </button>

          <div class="rule"></div>
          <label class="tile-control">
            타일 크기 <b id="tile-label">24</b>px
            <input id="tile-size" type="range" min="12" max="64" value="24">
          </label>
          <div class="help">
            <b>사용법</b><br>
            부품을 캔버스로 드래그<br>
            Shift+클릭/드래그: 다중 선택<br>
            선택한 부품 드래그: 함께 이동<br>
            출력에서 오브젝트로 선 연결<br>
            빈 곳을 드래그해 이동<br>
            휠로 확대·축소<br>
            포트 더블클릭으로 연결 해제
          </div>
        </aside>

        <section class="board-wrap" id="viewport">
          <div class="board" id="board">
            <div class="marquee" id="marquee"></div>
            <div class="world" id="world">
              <svg class="wire-layer" id="wires" viewBox="0 0 100000 100000"></svg>
              <div class="empty" id="empty">
                <div><span>⌁</span>사이드바에서 부품을 꺼내<br>무한 캔버스에 놓아보세요</div>
              </div>
            </div>
          </div>
        </section>
      </div>

      <div class="status" id="status" aria-live="polite">
        <b>준비됨</b> · 부품을 캔버스로 끌어 놓으세요. 출력선을 오브젝트 위에 놓으면 자동 연결됩니다.
      </div>
    </main>

    <script src="src/circuit-core.js"></script>
    <script src="src/renderer.js"></script>
  </body>
</html>
